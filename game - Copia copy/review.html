<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arena de Batalha RPG</title>
    <link rel="stylesheet" href="css.css" />
  </head>
  <body>
    <div class="centro">ARENA DE BATALHA</div>
    <div class="selecao-area">
      <div class="selecao-coluna">
        <h3>Jogador 1</h3>
        <button id="selLadino1" class="btn-choice active">Ladino</button>
        <button id="selBarbaro1" class="btn-choice">Bárbaro</button>
        <button id="selMago1" class="btn-choice">Mago</button>
        <button id="selMonge1" class="btn-choice">Monge</button>
      </div>
      <div class="selecao-coluna">
        <h3>Jogador 2</h3>
        <button id="selLadino2" class="btn-choice">Ladino</button>
        <button id="selBarbaro2" class="btn-choice active">Bárbaro</button>
        <button id="selMago2" class="btn-choice">Mago</button>
        <button id="selMonge2" class="btn-choice">Monge</button>
      </div>
    </div>
    <div class="linha">
      <div class="player">
        <h2 id="nomeJogadorUm">Leviatã</h2>
        <img
          id="ninja"
          src="https://anebarone.com/wp-content/uploads/2018/01/Anebarone-Rogue.jpg"
          alt="Jogador 1"
        />
        <div id="vidaJogadorUm" class="vida-texto">HP: 450</div>
        <div>
          <div id="barraVidaUm"></div>
        </div>
      </div>

      <div class="versus">VS</div>

      <div class="player">
        <h2 id="nomeJogadorDois">Itachi</h2>
        <img
          id="serjao"
          src="https://i.pinimg.com/originals/fe/2e/08/fe2e0834ad16ea30770e4a55170cdc0e.png"
          alt="Jogador 2"
        />
        <div id="vidaJogadorDois" class="vida-texto">HP: 450</div>
        <div>
          <div id="barraVidaDois"></div>
        </div>
      </div>
    </div>

    <button id="PLAY">COMEÇAR BATALHA</button>

    <div id="console" class="console"></div>

    <script src="jogo.js"></script>
  </body>
</html>
